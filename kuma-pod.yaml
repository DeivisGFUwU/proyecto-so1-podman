apiVersion: v1
kind: Pod
metadata:
  name: kuma-pod
spec:
  restartPolicy: Always
  containers:
    - name: uptime-kuma
      image: docker.io/louislam/uptime-kuma:1
      ports:
        - containerPort: 3001
          hostPort: 3001
      resources:
        limits:
          memory: "512Mi"
      volumeMounts:
        - name: kuma-data
          mountPath: /app/data
  volumes:
    - name: kuma-data
      persistentVolumeClaim:
        claimName: kuma-data